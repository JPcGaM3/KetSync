[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ctmig"
version = "0.3.0"
description = "Reader and TUI for the ct-migrate.sh LXC pre-sync engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

# The TUI is the only thing that needs a third-party package. Keep it optional
# so the state reader stays importable on a bare Proxmox node, which ships
# python3 but nothing else.
[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ctmig = "ctmig.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
