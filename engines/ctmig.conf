# =============================================================================
#  ctmig.conf  -  tuning for ct-migrate.sh   (sourced as shell, keep it simple)
# -----------------------------------------------------------------------------
#  This file exists so the engine can be regenerated/patched WITHOUT losing the
#  values that were calibrated against the real hardware. Never move these back
#  into the script.
#
#  Every value below is optional: the engine ships the same defaults. Anything
#  you set here wins. Every value is a plain integer (no units, no quotes) except
#  SSH_CIPHERS at the bottom, which is a cipher list.
# =============================================================================

# --- bandwidth ---------------------------------------------------------------
# BW_TOTAL_MB is the ceiling for the WHOLE tool, in MiB/s, across every lane.
# 230 MiB/s ~= 1.93 Gbps, which stays under the 2 Gbps budget.
# Each lane gets BW_TOTAL_MB / LANES and keeps it for the whole run, so the
# ceiling holds no matter which lanes happen to be running. That means a single
# active lane does NOT borrow the idle lane's share - deliberate: predictable
# beats optimal here. If you only ever run one schedule, set LANES=1.
BW_TOTAL_MB=500
LANES=1
BW_MIN_MB=20

# --- sizing ------------------------------------------------------------------
# Target image size = max(old rootfs quota, real usage x USAGE_FACTOR_PCT%).
# The factor exists because the source pool is ZFS with lz4: df inside the CT
# reports COMPRESSED usage, and the same data lands uncompressed on ext4.
# 185 was measured on this fleet - do not lower it without re-measuring.
USAGE_FACTOR_PCT=185
# Used only when usage cannot be read (CT not reachable): old quota + this %.
HEADROOM_PCT=30

# --- ENOSPC recovery ---------------------------------------------------------
# If rsync still hits ENOSPC (rc=11), grow the image by GROW_PCT and retry.
GROW_PCT=5
GROW_MAX_RETRY=3

# --- pool safety -------------------------------------------------------------
# Never allocate if doing so would leave the pool with less than this free.
POOL_RESERVE_GIB=100

# --- housekeeping ------------------------------------------------------------
# Daily log files in logs/ older than this many days are deleted at startup.
# A presync schedule writes one file per day forever otherwise. 0 disables it.
LOG_KEEP_DAYS=30

# --- transport ---------------------------------------------------------------
# The cipher list rsync's ssh uses for the DATA path only; the control path is
# left alone. OpenSSH negotiates chacha20-poly1305 first by default, which has
# no CPU instruction behind it and caps one stream at roughly 150-400 MB/s -
# exactly the ceiling a fast pool runs into. The AES-GCM ciphers use AES-NI and
# are typically about twice as fast on the same link, so this is usually the
# single biggest win available on a run that is hours of rsync.
# Set it empty to leave ssh to negotiate, if a peer ever refuses this list:
#   SSH_CIPHERS=
SSH_CIPHERS=aes128-gcm@openssh.com,aes256-gcm@openssh.com,aes128-ctr
