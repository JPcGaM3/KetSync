# =============================================================================
#  ctrep.conf  -  tuning for ct-replica.sh   (sourced as shell, keep it simple)
# -----------------------------------------------------------------------------
#  This file exists so the engine can be regenerated/patched WITHOUT losing the
#  values that were calibrated against the real hardware. Never move these back
#  into the script.
#
#  Every value below is optional: the engine ships the same defaults. Anything
#  you set here wins. Numeric values must be plain integers (no units).
# =============================================================================

# --- backup target -----------------------------------------------------------
# The address, and nothing else. The node's pmxcfs NAME is asked for rather
# than written down: the engines read /etc/pve/local over this same connection
# and take the answer. A name that is typed here is a name that can be wrong
# today, or right today and stale after a rename - and being wrong writes copy
# configs into a directory belonging to a different cluster member.
BKP_SSH="root@100.100.100.35"

# Uncomment ONLY to pin it, which means "refuse the run if the machine at
# BKP_SSH is not this node". The engines verify a pinned value; they never
# trust it.
#BKP_NODE="bkp02"

# Destination map: storage-id:dataset  (space separated entries)
#   storage-id : the PVE storage id on the backup node - and also what the
#                inventory's dest column says. There is no short key any more.
#                It used to be `hdd` and `ssd`, which meant nothing to anybody
#                who had not read this file, and sat next to a source storage
#                called tank-hdd-nas looking like two spellings of one thing.
#   dataset    : PARENT dataset on the backup node; the engine creates
#                subvol-<id>-disk-0 children under it (with xattr=sa and
#                acltype=posixacl, which LXC needs)
#
# The old form was key=dataset:storage-id and every engine now refuses it by
# name, because a fleet upgrading has that line in this file today.
#
# bkp02-setup.sh creates the datasets and the storage ids; only the POOLS
# (replica-hdd = new 6x HDD raid10, replica-ssd = 870 EVO mirror) are made by
# hand. Tiering concept: customer CTs that must start FAST in DR ->
# replica-ssd, CTs where slow is acceptable -> replica-hdd.
BKP_DESTS="replica-hdd:replica-hdd/ct replica-ssd:replica-ssd/ct"

# There is deliberately NO default destination. Every row in
# inventory-replica.tsv names its own pool, and a row that does not is refused
# by name. A default is the last kind of guess this tool still made: the row
# that forgot its dest looked exactly like the row that meant it, and the
# customer's DR copy landed on whichever pool this line happened to say.

# --- sources -----------------------------------------------------------------
# The only storages this tool is allowed to read from. A CT whose rootfs lives
# anywhere else fails loudly (inventory mode) or is skipped (auto mode).
SRC_STORAGES="tank-hdd-nas tank-ssd-nas"

# A non-ZFS source (e.g. a dir storage on XFS) has no snapshots, so there is
# no point-in-time copy - the live image is read while the CT writes to it.
# 0 = refuse (default, safe). 1 = allow, with a loud WARN every round.
LIVE_FALLBACK=0

# --- mock network ------------------------------------------------------------
# The copy gets the source CT's REAL net config - same IP, same MAC, everything
# - moved onto an ISOLATED bridge. Duplicate IPs are harmless because that
# bridge cannot reach a wire, so a copy can be booted for a drill while the
# real CT is live. Go-live is then a one-field edit (bridge back to the real
# one). GUARD R9 verifies the bridge has no uplink before EVERY run and refuses
# the whole run if it ever gains one.
#
# The engine never starts a copy - it only makes one that WOULD work if a human
# started it. onboot=0, always stopped.
#
# On the backup node, /etc/network/interfaces.d/vmbr99 (OVS, no uplink):
#   auto vlan99
#   iface vlan99 inet static
#           address 192.168.99.1/24
#           ovs_type OVSIntPort
#           ovs_bridge vmbr99
#           ovs_mtu 9000
#           ovs_options tag=99
#   auto vmbr99
#   iface vmbr99 inet manual
#           ovs_type OVSBridge
#           ovs_ports vlan99
#           ovs_mtu 9000
#
# MOCKNET_TAG="" keeps each CT's OWN VLAN tag and changes nothing but the
# bridge - the copy's net line is then byte-identical to production except for
# that one field. Keeping the tag matters when customers sit on separate VLANs
# with reusable IP ranges: forcing every copy onto one VLAN would make the
# copies collide with EACH OTHER on the island. Isolation does not depend on
# the tag - it comes from the bridge having no uplink (R9).
# Set a number instead to force all copies onto one VLAN (only useful when the
# whole fleet shares a single subnet).
#
# To reach a copy during a drill, add a temporary internal port on ITS vlan and
# give the host an address in ITS subnet, then remove both afterwards:
#   ovs-vsctl add-port vmbr99 t50 -- set interface t50 type=internal -- set port t50 tag=50
#   ip addr add 10.100.1.254/24 dev t50 && ip link set t50 up
#   ...test...
#   ip link set t50 down && ovs-vsctl del-port vmbr99 t50
# (untagged sources need the same without the "set port ... tag=" part)
#
# MOCKNET=0 makes copies with no network at all (the old behaviour).
MOCKNET=1
MOCKNET_BRIDGE=vmbr99
MOCKNET_TAG=""

# --- identity ----------------------------------------------------------------
# Copy VMID = src_ctid + OFFSET unless the inventory row sets its own tgt_ctid.
OFFSET=8000

# REFUSED if set to 1. Replicating a container that has no inventory row means
# guessing which pool its copy belongs on, and there is no default to guess
# with any more. List the containers you replicate, each with its dest.
AUTO_DISCOVER=0

# --- bandwidth / transport ---------------------------------------------------
# BW_TOTAL_MB is the ceiling for the WHOLE tool, in MiB/s, across every lane.
# Each lane gets BW_TOTAL_MB / LANES and keeps it for the whole run, so the
# ceiling holds no matter which lanes happen to be running. Running one cron
# per storage? Set LANES to how many of those schedules can overlap:
#   */15 * * * * root /root/ct-replica/ct-replica.sh --storage tank-hdd-nas
#   */15 * * * * root /root/ct-replica/ct-replica.sh --storage tank-ssd-nas
#   -> LANES=2
BW_TOTAL_MB=230
LANES=1
BW_MIN_MB=20

# rsync-transport cipher list. Default prefers AES-GCM (AES-NI accelerated,
# ~2x chacha20 on wired links). Empty = let ssh negotiate.
#SSH_CIPHERS=aes128-gcm@openssh.com,aes256-gcm@openssh.com,aes128-ctr

# --- housekeeping ------------------------------------------------------------
LOG_KEEP_DAYS=14
RUNS_KEEP=200      # per-CT run history lines kept in state/<src_ctid>.runs.jsonl
# HEALTH_URL="https://hc-ping.com/your-uuid"
