name: ci

# Nothing here is built. The engines are deployed by copying files onto a
# Proxmox node, so there is no compile step to break. What CI is for in this
# repo is the thing that is easy to skip by hand: proving the test suite can
# still fail. `make mutation` is the target that matters most in this workflow.
#
# One tree since the restructure: the root Makefile owns every gate for both
# layers, so these four steps are the whole story.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install what the suites need
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck rsync
          python -m pip install --quiet pytest jsonschema

      - name: lint both layers
        run: make lint

      - name: both layers must still be a working install
        run: make test

      # A green suite means nothing until you have watched it go red for the
      # right reason. This reintroduces every known bug one at a time, across
      # both layers, and fails if the simulators let any of them through.
      #
      # The count used to be written out here and was wrong by eighty within
      # two months - nothing in CI can check a number in a comment, and every
      # commit that adds a mutation moves it. The runners print their own
      # totals; read them there.
      - name: mutation
        run: make mutation
