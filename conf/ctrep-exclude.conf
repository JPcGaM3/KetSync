# =============================================================================
#  ctrep-exclude.conf  -  what replication does NOT copy.
# -----------------------------------------------------------------------------
#  One rsync pattern per line. Blank lines and lines beginning with # are
#  ignored - that is rsync's own rule for --exclude-from, not something this
#  tool adds. A leading / anchors the pattern at the ROOT OF THE CONTAINER,
#  never at the root of any node.
#
#  Read by ct-replica.sh (production -> the copy) AND by ct-failback.sh (the
#  copy -> back into production). ONE file on purpose: both directions run
#  rsync --delete, so a pattern that applied in only one of them is how a path
#  that was never copied gets DELETED from production on the way back.
#
#  The three shipped lines are boot-time junk - worthless in a DR copy, and the
#  main thing that trips the read-only,noload mount after a container restart.
#  They are not a guess about your fleet: they are what this tool has excluded
#  since it was written. They stayed inside the engine until it became clear
#  that the one thing every site wants to change is the one thing you had to
#  edit a script to change.
#
#  Every pattern you add is data the copy will not have, and a copy is only as
#  good as what is in it. Exclude caches and scratch. Never exclude state.
# =============================================================================
/tmp/*
/run/*
/var/tmp/systemd-private-*

# Not a container path: the DESTINATION is a ZFS dataset, and `.zfs` is its
# snapshot control directory. It is normally not in the directory listing, but
# if anybody ever sets snapdir=visible on a copy, rsync sees a `.zfs` on the
# receiving side that the source has no counterpart for - and --delete then
# grinds through every file of every snapshot trying to remove a read-only
# tree. Excluded entries are not deleted (that is rsync's default), so this one
# line makes replication immune to that whichever way the property is set.
# It cost a night once.
/.zfs

# PHP session files - the whole DIRECTORY, not the sess_* names inside it, and
# the difference is the entire point. Hestia points every user's
# session.save_path at their own /home/<user>/tmp, and a busy site turns
# thousands of those files over every minute, so R1's snapshot always catches
# that directory mid-update. What ext4 says about it depends on which half of
# the update was caught, and this fleet produced both within one morning: a
# leaf block whose checksum no longer matches its content answers EBADMSG per
# file - "Bad message (74)" - and an htree index caught mid-split answers
# EUCLEAN for the directory itself, "Structure needs cleaning (117)". The
# second cannot be excluded by filename: rsync must readdir a directory before
# it can filter what is inside, so the read fails before any pattern is
# consulted. Excluding the directory is what stops rsync descending at all.
#
# Both end the round rc=23, and rsync also skips --delete for the whole run
# once it has seen an IO error - that is the expensive half, not the exit code,
# because the copy then quietly stops converging while looking merely red.
#
# Neither is a damaged image, and the difference is worth proving rather than
# assuming: `tune2fs -l <image>` said state clean with no error count, and the
# kernel had logged no EXT4-fs error, before this line was written. Repeat that
# check before excluding any other directory for the same reason - the whole
# value of R5 is that it refuses a torn copy, and a pattern added to silence it
# without that check throws the guard away. Images made before metadata_csum
# became mkfs.ext4's default returned the stale directory block silently
# instead of erroring, which is why this arrived with an intake and not with a
# disk fault.
#
# What it costs: a promoted copy logs its users out. They are session cookies
# for a container that is not running. The directories themselves already exist
# on every copy, and excluded entries are never deleted, so PHP still has
# somewhere to write the moment a copy is promoted.
/home/*/tmp/
#
# Hestia keeps a SECOND session directory for its own control panel, and it is
# the same churn with the same failure: the round after /home/*/tmp/ went
# quiet, CT 252 answered EBADMSG per sess_* file under
# /usr/local/hestia/data/sessions instead (2026-09-01, readlink_stat "Bad
# message (74)", rc=23, --delete skipped for the round). Same class of
# contents - panel login sessions, stale the moment a copy is promoted - and
# the engines' skeleton pass puts the directory itself back with its own
# owner and mode, so the panel can write the moment a copy serves. The
# tune2fs / EXT4-fs error proof demanded above was repeated on 252's image
# before this line was added.
/usr/local/hestia/data/sessions/
